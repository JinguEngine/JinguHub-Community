name: Mirror and reconcile public Communities

on:
  push:
    branches: [main]
    paths:
      - communities.json
      - scripts/community-contract.cjs
      - scripts/build-community-snapshot.cjs
      - scripts/migrate-community-catalog.cjs
      - .github/workflows/continuity-mirror.yml
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:

concurrency:
  group: jingu-community-reconcile-${{ github.repository }}
  cancel-in-progress: false

jobs:
  mirror:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Build canonical compatibility projection
        run: node scripts/build-community-snapshot.cjs communities.json communities-snapshot.json
      - name: Mirror canonical snapshot
        env:
          CONTINUITY_URL: ${{ vars.JINGU_CONTINUITY_URL }}
          INGEST_KEY: ${{ secrets.JINGU_CONTINUITY_INGEST_KEY }}
        run: |
          set -euo pipefail
          test -n "$CONTINUITY_URL"
          test -n "$INGEST_KEY"
          curl --fail-with-body --silent --show-error \
            --retry 3 --retry-all-errors \
            -X PUT "${CONTINUITY_URL%/}/v1/admin/snapshots/communities" \
            -H 'Content-Type: application/json' \
            -H "X-Jingu-Ingest-Key: $INGEST_KEY" \
            --data-binary @communities-snapshot.json

  migrate-legacy-source:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - id: migration
        name: Build deterministic old-to-current migration
        shell: bash
        run: |
          set -euo pipefail
          rm -f communities-upgraded.json
          node scripts/migrate-community-catalog.cjs communities.json communities-upgraded.json
          if test -f communities-upgraded.json; then
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Persist upgraded canonical source
        if: steps.migration.outputs.needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          current_sha="$(gh api "repos/${GITHUB_REPOSITORY}/contents/communities.json?ref=${GITHUB_REF_NAME}" --jq .sha)"
          encoded="$(base64 -w0 communities-upgraded.json)"
          gh api --method PUT "repos/${GITHUB_REPOSITORY}/contents/communities.json" \
            -f message='chore: migrate Communities catalog to current Jingu contract' \
            -f content="$encoded" \
            -f sha="$current_sha" \
            -f branch="$GITHUB_REF_NAME" >/dev/null
